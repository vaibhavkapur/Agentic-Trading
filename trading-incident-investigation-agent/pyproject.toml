[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-incident-investigation-agent"
version = "0.1.0"
description = "Evidence-backed trading incident investigation agent with deterministic timeline normalization, runbook hypothesis testing, untrusted-log sanitization, and approval-gated simulated remediation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Trading-Agentic Contributors" }
]
dependencies = [
  "pydantic>=2.10.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "ruff>=0.6.0,<1.0.0",
]

[project.scripts]
trading-incident-agent = "trading_incident_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
