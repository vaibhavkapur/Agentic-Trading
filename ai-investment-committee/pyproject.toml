[build-system]
requires = ["setuptools>=58.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-investment-committee"
version = "0.1.0"
description = "Evidence-based multi-agent investment committee prototype with deterministic risk veto, hash-bound human approval, and SQLite deliberation replay (paper/research only)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Trading-Agentic Contributors" }
]
# Core runtime uses Python standard library only (dataclasses, sqlite3, json,
# hashlib, decimal, unittest) for deterministic offline reproducibility.
dependencies = []

[project.optional-dependencies]
pydantic = [
  "pydantic>=2.7.0,<3.0.0",
]
dev = [
  "pytest>=8.0.0,<9.0.0",
  "ruff>=0.6.0,<1.0.0",
  "mypy>=1.10.0,<2.0.0",
]

[project.scripts]
ai-committee = "ai_investment_committee.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
strict = true
mypy_path = "src"
