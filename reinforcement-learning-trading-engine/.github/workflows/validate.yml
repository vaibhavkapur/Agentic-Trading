name: validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install -r requirements-gym.txt
      - run: scripts/test.sh
      - run: python scripts/demo.py --out reports/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation
          path: reports/ci/
