[build-system]
requires = ["setuptools>=58.0"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-intelligence-agent"
version = "0.1.0"
description = "Revision-aware macroeconomic release and central bank communication intelligence prototype with publication gates, verifiable citations, and deterministic evaluation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Trading-Agentic Contributors" }
]
# Core runtime uses Python 3.9+ standard library only (dataclasses, sqlite3,
# decimal, datetime, hashlib, json, re, unittest) for offline reproducibility.
# Optional Pydantic v2 adapter is exposed when the [pydantic] extra is installed.
dependencies = []

[project.optional-dependencies]
pydantic = [
  "pydantic>=2.7.0,<3.0.0",
]
dev = [
  "pytest>=8.0.0,<9.0.0",
  "ruff>=0.6.0,<1.0.0",
  "mypy>=1.10.0,<2.0.0",
]

[project.scripts]
macro-agent = "macro_intelligence_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
strict = true
mypy_path = "src"
