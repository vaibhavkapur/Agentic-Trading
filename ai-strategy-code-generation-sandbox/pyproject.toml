[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-strategy-code-generation-sandbox"
version = "0.1.0"
description = "Isolated, resource-bounded paper-experiment sandbox for evaluating AI-generated trading strategy code."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Trading-Agentic Contributors" }
]
dependencies = [
  "pydantic>=2.10,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
]

[project.scripts]
strategy-sandbox = "strategy_sandbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
