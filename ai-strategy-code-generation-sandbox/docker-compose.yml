# Rootless, network-isolated container profile for paper experiment runs.
services:
  strategy-sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    user: "10001:10001"
    network_mode: "none"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 256m
    cpus: "0.50"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    environment:
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      LC_ALL: "C"
