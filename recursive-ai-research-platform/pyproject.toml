[build-system]
requires = ["setuptools>=58.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recursive-ai-research-platform"
version = "0.1.0"
description = "Auditable recursive AI research loop with typed experiment DSL, bounded DAG scheduler, immutable run registry, evidence-linked critic, blinded holdout protection, and independent paper-only review gate."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Proprietary - Internal Research Prototype"}
dependencies = []

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
postgres = [
    "psycopg[binary]>=3.1",
]
storage = [
    "boto3>=1.34",
]
dev = [
    "pytest>=7.4",
]

[project.scripts]
rarp = "rarp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
