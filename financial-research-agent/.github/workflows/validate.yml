name: Validate research agent
on: [push, pull_request]
jobs:
  local-mvp:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: ./scripts/setup
      - run: ./scripts/validate > validation.txt 2>&1
      - run: ./scripts/demo > demo.jsonl.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.python }}
          path: |
            validation.txt
            demo.jsonl.txt
