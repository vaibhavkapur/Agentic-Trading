name: AI Investment Committee CI

on:
  push:
    paths:
      - "ai-investment-committee/**"
      - ".github/workflows/ai-investment-committee.yml"
  pull_request:
    paths:
      - "ai-investment-committee/**"
      - ".github/workflows/ai-investment-committee.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: ai-investment-committee
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit, integration, and boundary tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v

      - name: Run reproducible demo and acceptance checks
        run: python3 scripts/run_acceptance.py

      - name: Verify CLI help and fixture execution
        run: |
          PYTHONPATH=src python3 -m ai_investment_committee --help
          PYTHONPATH=src python3 -m ai_investment_committee run \
            --db /tmp/ci_committee.sqlite3 \
            --proposal data/fixtures/valid_reference_proposal.json > /dev/null
