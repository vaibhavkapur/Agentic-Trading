name: AI Strategy Code Generation Sandbox CI

on:
  push:
    paths:
      - "ai-strategy-code-generation-sandbox/**"
      - ".github/workflows/ai-strategy-code-generation-sandbox.yml"
  pull_request:
    paths:
      - "ai-strategy-code-generation-sandbox/**"
      - ".github/workflows/ai-strategy-code-generation-sandbox.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-strategy-code-generation-sandbox

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      - name: Validate default sandbox configuration
        run: |
          PYTHONPATH=src python -m strategy_sandbox.cli validate-config \
            --config config/default_sandbox_config.json

      - name: Run full test suite (unit, security, leakage, governance, CLI)
        run: |
          PYTHONPATH=src pytest -v

      - name: Run reproducible demo and acceptance benchmarks
        run: |
          PYTHONPATH=src python scripts/run_demo_and_benchmarks.py
