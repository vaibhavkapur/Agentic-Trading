name: Validate local RAG platform
on: [push, pull_request]
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build fixture index
        run: ./scripts/setup.sh
      - name: Test, evaluate, and exercise demo
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=src python3 -m unittest discover -v 2>&1 | tee reports/ci-tests.txt
          python3 scripts/evaluate.py --output reports/ci-evaluation.json
          python3 scripts/demo.py > reports/ci-demo.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-python-${{ matrix.python }}
          path: reports/ci-*
